[camera]
position = [0.0, 1.0, 6.8]
look_at = [0.0, 1.0, 0.0]
ref_up = [0.0, 1.0, 0.0]
fov = 19.5

[film]
resolution = [512, 512]
num_samples = 256

[integrator]
type = "path"
max_depth = 64
rr_depth = 8
rr_prob = 0.95

[[material]]
name = "grey"
type = "materialx"
file = "Cbox.mtlx"
material = "grey"

[[material]]
name = "green"
type = "materialx"
file = "Cbox.mtlx"
material = "green"

[[material]]
name = "red"
type = "materialx"
file = "Cbox.mtlx"
material = "red"

[[primitive]]
type = "trimesh"
path = "geometry/light.ply"
light = { type = "area", emission = [17.0, 12.0, 5.0] }

[[primitive]]
type = "trimesh"
path = "geometry/floor.ply"
material = "grey"

[[primitive]]
type = "trimesh"
path = "geometry/left.ply"
material = "red"

[[primitive]]
type = "trimesh"
path = "geometry/right.ply"
material = "green"

[[primitive]]
type = "trimesh"
path = "geometry/ceiling.ply"
material = "grey"

[[primitive]]
type = "trimesh"
path = "geometry/back.ply"
material = "grey"

[[primitive]]
type = "trimesh"
path = "geometry/boxes.ply"
material = "grey"
