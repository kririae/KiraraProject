default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^vcpkg/ports/openimageio/fix-scanline-color-transform\.patch$
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.4
    hooks:
      - id: clang-format
        files: ^flux/
        types_or: [c++, c, cuda]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: verify-commit-message
        name: verify commit message
        entry: scripts/verify-commit-message.py
        language: python
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: verify-md-wrap
        name: verify agent documents keep one line per paragraph
        entry: scripts/verify-md-wrap.py
        language: python
        additional_dependencies: [markdown-it-py==4.2.0]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: verify-md-links
        name: verify agent document links
        entry: scripts/verify-md-links.py
        language: python
        additional_dependencies: [markdown-it-py==4.2.0]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: verify-skills
        name: verify skill shape
        entry: scripts/verify-skills.py
        language: python
        additional_dependencies: [markdown-it-py==4.2.0]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: verify-agents-md
        name: verify the word limit and the routes of each AGENTS.md
        entry: scripts/verify-agents-md.py
        language: python
        additional_dependencies: [markdown-it-py==4.2.0]
        pass_filenames: false
        always_run: true
